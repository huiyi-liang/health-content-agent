[project]
name = "health-content-agent"
version = "0.1.0"
description = "A health-content idea-to-article multi-agent learning project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
